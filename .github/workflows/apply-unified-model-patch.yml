name: Aplicar correcciones modelo SIACD

on:
  push:
    branches: [fix/unificar-modelo-129]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unificar-modelo-129
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar parche
        run: python scripts/patch_unified_model.py
      - name: Retirar utilidades temporales
        run: rm -f scripts/patch_unified_model.py .github/workflows/apply-unified-model-patch.yml
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unifica panel, indicadores, trazabilidad e informes" || exit 0
          git push origin HEAD:fix/unificar-modelo-129
