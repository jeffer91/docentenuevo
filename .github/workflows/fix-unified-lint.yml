name: Ajuste final modelo SIACD
on:
  push:
    branches: [fix/unificar-modelo-129]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unificar-modelo-129
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_unified_lint.py
      - run: rm -f scripts/fix_unified_lint.py .github/workflows/fix-unified-lint.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ajusta estado borrador de informes" || exit 0
          git push origin HEAD:fix/unificar-modelo-129
